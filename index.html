<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maa's Operations – Preview</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#3D1A6E"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#F3EBDD;font-family:system-ui,Segoe UI,Arial,sans-serif;color:#2b2233}
.ban{background:#C9A227;color:#2b2233;text-align:center;font-weight:700;font-size:.85rem;padding:5px}
.wrap{display:flex;min-height:100vh}aside{width:230px;background:#fff;border-right:1px solid #e6dccb;padding:14px;flex-shrink:0}
.brand{display:flex;gap:10px;align-items:center;margin-bottom:6px}.brand img{width:44px;height:44px;border-radius:8px}.brand b{color:#3D1A6E;display:block}.brand small{color:#6b6175;font-size:.72rem;letter-spacing:.05em}
nav a{display:flex;gap:10px;align-items:center;padding:10px;border-radius:8px;color:#2b2233;text-decoration:none;font-size:.93rem;margin:2px 0}nav a.on{background:#EDE3F5;color:#3D1A6E;font-weight:700}
.role{margin:10px 0 14px}.role label{font-size:.75rem;color:#6b6175;display:block;margin-bottom:3px}select,input,textarea{font:inherit;padding:8px;border:1px solid #cfc3dc;border-radius:8px;background:#fff}
main{flex:1;padding:20px;max-width:1100px}.eb{color:#5B2A86;font-size:.75rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase}h1{color:#3D1A6E;margin:2px 0 14px;font-size:1.6rem}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.c{background:#fff;border-radius:12px;padding:14px;box-shadow:0 1px 3px #0001;margin-bottom:12px}.c h3{margin:0 0 8px;color:#3D1A6E;font-size:1rem}
.g{display:grid;gap:12px}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.k small{color:#6b6175;font-size:.78rem}.k b{display:block;font-size:1.8rem;color:#3D1A6E;margin:4px 0}.k .red{color:#B3261E}
.btn{background:#5B2A86;color:#fff;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer;font-size:.9rem}.btn.g{background:#2E7D4F}.btn.y{background:#C9A227;color:#2b2233}.btn.o{background:#fff;color:#5B2A86;border:2px solid #5B2A86}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.row:last-child{border:0}
.muted{color:#6b6175;font-size:.85rem}.tag{border-radius:20px;padding:3px 9px;font-size:.75rem;font-weight:700;white-space:nowrap}.ok{background:#E3F1E8;color:#2E7D4F}.warn{background:#FBE3E1;color:#B3261E}.pp{background:#EDE3F5;color:#5B2A86}.gold{background:#F6EBC4;color:#6b5000}
.note{background:#EDE3F5;border-radius:10px;padding:10px 12px;color:#3D1A6E;font-size:.88rem;margin-bottom:12px}
.tl div{padding:7px 0;border-bottom:1px solid #eee;font-size:.88rem}.tl b{color:#5B2A86;font-family:monospace;font-size:.8rem;display:block}
.cnt{display:flex;align-items:center;gap:14px}.cnt button{width:44px;height:44px;border-radius:10px;border:1px solid #cfc3dc;background:#fff;font-size:1.4rem;cursor:pointer}.cnt b{font-size:2.4rem;color:#3D1A6E;font-family:monospace;min-width:90px;text-align:center}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}.tabs button{border:1px solid #cfc3dc;background:#fff;border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:600}.tabs button.on{background:#5B2A86;color:#fff;border-color:#5B2A86}
.kiosk{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.kiosk button{padding:22px 10px;border-radius:14px;border:3px solid #2E7D4F;background:#fff;font-size:1.1rem;font-weight:800;color:#2E7D4F;cursor:pointer}.kiosk button.in{background:#2E7D4F;color:#fff}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#2E7D4F;color:#fff;padding:12px 18px;border-radius:10px;font-weight:700;display:none;z-index:9;max-width:92vw;text-align:center}
.sw{width:42px;height:24px;border-radius:12px;background:#ddd;position:relative;border:0;cursor:pointer}.sw.on{background:#5B2A86}.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff}.sw.on::after{left:21px}
table{width:100%;border-collapse:collapse;font-size:.88rem}th{text-align:left;color:#6b6175;font-weight:600;padding:6px;border-bottom:1px solid #e6dccb}td{padding:7px 6px;border-bottom:1px solid #f0eae0}
.mb{display:none}
@media(max-width:820px){.wrap{display:block}aside{width:auto;border:0;padding:10px 12px;position:sticky;top:0;z-index:5}nav{display:flex;overflow-x:auto;gap:4px}nav a{white-space:nowrap;padding:8px 10px;font-size:.85rem}
.brand img{width:34px;height:34px}.rb{display:flex;align-items:center;justify-content:space-between;gap:8px}.role{margin:0}main{padding:12px}.g4{grid-template-columns:1fr 1fr}.g2,.g3{grid-template-columns:1fr}.kiosk{grid-template-columns:1fr 1fr}.hide-m{display:none}}
</style></head><body>
<div class="ban">Preview — sample data. Nothing is sent; no real texts or emails.</div>
<div class="wrap"><aside><div class="rb"><div class="brand"><img src="icon-192.png" alt=""><div><b>MAA's Inspiration</b><small>OPERATIONS</small></div></div>
<div class="role"><label for="role">Viewing as</label><select id="role"><option>Owner</option><option>Admin</option><option>Volunteer</option></select></div></div>
<nav id="nav"></nav><div class="hide-m" style="margin-top:16px"><button class="btn o" id="reset" style="width:100%">↺ Reset demo</button></div></aside>
<main id="main"></main></div><div class="toast" id="toast"></div>
<script src="app.js?v=9"></script></body></html>
